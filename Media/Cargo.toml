[package]
name = "permissionguide-media"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[dependencies]
fframes = { version = "=1.2.0", features = ["compile-time-svgtree", "cli"] }
fframes_skia_renderer = { version = "=1.2.0", features = ["metal"] }

[target.'cfg(target_os = "macos")'.dependencies]
fframes = { version = "=1.2.0", features = ["videotoolbox"] }

[lib]
name = "permissionguide_media"
path = "src/lib.rs"
doctest = false

[workspace]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release.build-override]
opt-level = 3
