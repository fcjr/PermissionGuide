name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build examples
        run: |
          swift build --package-path Examples/PermissionGuideDemo
          swift build --package-path Examples/InstallerDemo
